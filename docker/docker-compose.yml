networks:
  backend:


services:
  traefik:
    image: traefik:v3.0
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --api.insecure=true
      - --entrypoints.web.address=:80
    ports:
      - "80:80" # Public HTTP traffic
      - "8080:8080" # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.http.routers.traefik.rule=Host(`localhost`) && PathPrefix(`/dashboard`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=web"
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672" # AMQP protocol (for apps)
      - "15672:15672" # RabbitMQ dashboard (browser)
    networks:
      - backend
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  auth-service:
    build: ../backend/dotnet-services/UserRoleService
    ports:
      - "8001:7192"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      auth-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=7192"
      - "traefik.http.routers.auth.middlewares=strip-auth@docker"
      - "traefik.http.middlewares.strip-auth.stripprefix.prefixes=/auth"
    networks:
      - backend

  receipt-service:
    build: ../backend/dotnet-services/ReceiptService/CashierSolution
    ports:
      - "8006:7048"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.receipt.rule=PathPrefix(`/receipt`)"
      - "traefik.http.routers.receipt.entrypoints=web"
      - "traefik.http.services.receipt.loadbalancer.server.port=7048"
      - "traefik.http.routers.receipt.middlewares=strip-receipt@docker"
      - "traefik.http.middlewares.strip-receipt.stripprefix.prefixes=/receipt"
    networks:
      - backend
      
  order-service:
    build: ../backend/dotnet-services/OrderService
    volumes:
      - ../backend/dotnet-services/OrderService:/app
    ports:
      - "8002:8085"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - dotnet-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.order.rule=PathPrefix(`/order`)"
      - "traefik.http.routers.order.entrypoints=web"
      - "traefik.http.services.order.loadbalancer.server.port=8085"
      - "traefik.http.routers.order.middlewares=strip-order@docker"
      - "traefik.http.middlewares.strip-order.stripprefix.prefixes=/order"
    networks:
      - backend

  shift-service-dotnet:
    build: ../backend/dotnet-services/ShiftService
    volumes:
      - ../backend/dotnet-services/ShiftService:/app
    ports:
      - "8011:8086"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - dotnet-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shift-dotnet.rule=PathPrefix(`/shift`)"
      - "traefik.http.routers.shift-dotnet.entrypoints=web"
      - "traefik.http.services.shift-dotnet.loadbalancer.server.port=8086"
      - "traefik.http.routers.shift-dotnet.middlewares=strip-shift-dotnet@docker"
      - "traefik.http.middlewares.strip-shift-dotnet.stripprefix.prefixes=/shift"
    networks:
      - backend

  notification-service:
    build: ../backend/springboot-services/notification-service
    volumes:
      - ../backend/springboot-services/notification-service:/app
      - ~/.m2:/root/.m2
    ports:
      - "8003:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_NOTIFICATION_DATASOURCE_URL=${SPRING_NOTIFICATION_DATASOURCE_URL}
      - NOTIFICATION_POSTGRES_USER=${NOTIFICATION_POSTGRES_USER}
      - NOTIFICATION_POSTGRES_PASSWORD=${NOTIFICATION_POSTGRES_PASSWORD}
    depends_on:
      - notification-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notifications.rule=PathPrefix(`/notifications`)"
      - "traefik.http.routers.notifications.entrypoints=web"
      - "traefik.http.services.notifications.loadbalancer.server.port=8080"
      - "traefik.http.routers.notifications.middlewares=strip-notifications@docker"
      - "traefik.http.middlewares.strip-notifications.stripprefix.prefixes=/notifications"
    networks:
      - backend

  catalog-service:
    build: ../backend/springboot-services/catalog-service
    volumes:
      - ../backend/springboot-services/catalog-service:/app
      - ~/.m2:/root/.m2
    ports:
      - "8005:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CATALOG_DATASOURCE_URL=jdbc:postgresql://catalog-db:5432/catalog_db
      - CATALOG_POSTGRES_USER=catalog_db
      - CATALOG_POSTGRES_PASSWORD=catalog_db
    depends_on:
      - catalog-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catalog.rule=PathPrefix(`/catalog`)"
      - "traefik.http.routers.catalog.entrypoints=web"
      - "traefik.http.services.catalog.loadbalancer.server.port=8080"
      - "traefik.http.routers.catalog.middlewares=strip-catalog@docker"
      - "traefik.http.middlewares.strip-catalog.stripprefix.prefixes=/catalog"
    networks:
      - backend
  
  inventory-service:
    build: ../backend/springboot-services/inventory-service
    volumes:
      - ../backend/springboot-services/inventory-service:/app
      - ~/.m2:/root/.m2
    ports:
      - "8008:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_INVENTORY_DATASOURCE_URL=jdbc:postgresql://inventory-db:5432/inventory_db
      - INVENTORY_POSTGRES_USER=inventory_db
      - INVENTORY_POSTGRES_PASSWORD=inventory_db
    depends_on:
      - inventory-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.inventory.rule=PathPrefix(`/inventory`)"
      - "traefik.http.routers.inventory.entrypoints=web"
      - "traefik.http.services.inventory.loadbalancer.server.port=8080"
      - "traefik.http.routers.inventory.middlewares=strip-inventory@docker"
      - "traefik.http.middlewares.strip-inventory.stripprefix.prefixes=/inventory"
    networks:
      - backend

  tenant-service:
    build: ../backend/springboot-services/tenant-service
    volumes:
      - ../backend/springboot-services/tenant-service:/app
      - ~/.m2:/root/.m2
    ports:
      - "8004:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DB_HOST=tenant-db
      - DB_PORT=5432
      - DB_NAME=${TENANT_POSTGRES_DB:-tenant_db}
      - DB_USERNAME=${TENANT_POSTGRES_USER:-postgres}
      - DB_PASSWORD=${TENANT_POSTGRES_PASSWORD:-postgres}
      - SUBSCRIPTION_SERVICE_URL=${SUBSCRIPTION_SERVICE_URL:-http://subscription-service:8080}
      - AUTH_SERVICE_URL=http://auth-service:7192
      - USER_ROLE_SERVICE_URL=http://auth-service:7192
      - JWT_SECRET=${JWT_SECRET:-mySecretKey123456789012345678901234567890}
      - JWT_ISSUER=${JWT_ISSUER:-https://localhost:7192}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-https://localhost:3000}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS:-guest}
      - SECURITY_USER_NAME=admin
      - SECURITY_USER_PASSWORD=admin123
    depends_on:
      - tenant-db
      - rabbitmq
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tenant.rule=PathPrefix(`/tenant`)"
      - "traefik.http.routers.tenant.entrypoints=web"
      - "traefik.http.services.tenant.loadbalancer.server.port=8080"
      - "traefik.http.routers.tenant.middlewares=strip-tenant@docker"
      - "traefik.http.middlewares.strip-tenant.stripprefix.prefixes=/tenant"
    networks:
      - backend

  notification-db:
    image: postgres:14
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB}
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  catalog-db:
    image: postgres:14
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_db
      POSTGRES_PASSWORD: catalog_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  inventory-db:
    image: postgres:14
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_db
      POSTGRES_PASSWORD: inventory_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  dotnet-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dotnet-db
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - backend

  auth-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: auth-db
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "pidof sqlservr || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  tenant-db:
    image: postgres:14
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: tenant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
